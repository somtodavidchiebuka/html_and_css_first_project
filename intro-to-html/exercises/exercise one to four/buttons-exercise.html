<style>
    button {
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        cursor: pointer;
    }

    .no1, .no2, .no3, .no4, .no5
     {
        background-color: rgb(255,255,255);
        border: none;
    }
    .Stretch-button {
        background-color: rgb(4, 155, 4);
        font-size: 25px;
        color: aliceblue;
        border: none;
        padding-right: 15px;
        padding-left: 15px;
        transition: 1s;
        margin-right: 80px;
        cursor: pointer;
    }
    .Stretch-button:hover {
        font-size: 50px;
        transition: 1s;
        padding-right: 20px;
        padding-left: 20px;
    }

    .Shadow-button {
        background-color: rgb(4, 155, 4);
        font-size: 25px;
        color: aliceblue;
        border: none;
        padding-right: 15px;
        padding-left: 15px;
        cursor: pointer;
        margin-right: 80px;
        transition: opacity 0.16s;
        box-shadow: 7px 5px 7px rgba(0,0,0,0.5);

    }

    .Shadow-button:hover {
        opacity: 0.8;
    }
    .Shadow-button:active {
        background-color: rgb(4, 155, 4); 
        vertical-align: left;
        font-size: 20px;
        padding-right: 15px;
        padding-left: 15px;   
        color: aliceblue;
        border: none;
        box-shadow: none;
    }

    .One-button, .Two-button, .Three-button {
        background-color: rgb(4, 155, 4);
        font-size: 25px;
        color: aliceblue;
        border: none;
        padding-right: 15px;
        padding-left: 15px;
        cursor: pointer;
        margin-right: 15px;
        transition: opacity 0.3s;
    }

    .One-button:hover, .Two-button:hover, .Three-button:hover {
        padding-right: 25px;
        padding-left: 25px;
        transition: 0.7s;
    }
</style>


<button class="Stretch-button">
    Stretch
</button>

<button class="Shadow-button">
    Shadow
</button>

<button class="One-button">
    One
</button>

<button class="Two-button">
    Two
</button>

<button class="Three-button">
    Three
</button>
