<!DOCTYPE html>
<html>
    <head>
        <title> 12f Exercise </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            .body {
                margin: 0;
            }
            .layout {
                font-family: Montserrant, sans-serif;
                background-color: blueviolet;
                height: 50px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;

            }
            .home {
                border: none;
                background-color: blueviolet;
                color: white;
                font-weight: bold;
                padding-left: 10px;
            }
            .download {
                border-radius: 3px;
                border: solid;
                color: white;
                border-width: 1px;
                border-color: white;
                padding-right: 10px;
                padding-left: 10px;
                padding-top: 5px;
                padding-bottom: 5px;
                background: none;
                margin-right: 10px;
            }
            .search-bar {
                border-radius: 10px;
                border: none;
                color: gray;
                padding-left: 15px;
                padding-right: 200px;
                padding-top: 5px;
                padding-bottom: 5px;         
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <div class="home-container"><button class="home">Home</button></div>
            <div class="search-container"><input class="search-bar" type="text" placeholder="Search"></div>
            <div class="download-container"><button class="download">Download</button></div>
        </div>
    </body>
</html>
