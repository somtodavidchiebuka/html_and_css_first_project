<!DOCTYPE html>
<html>
    <head>
        <title>
            YouTube.com Clone
        </title>
        <style>
            .thumbnail {
                width: 50px;
                object-fit: cover;
                object-position: right;
                height: 50px;
                border-radius: 600px;
                vertical-align: middle;
            }

            .enter {
                vertical-align: middle;
                border: none;
                font-size: large;
                margin-left: 10px;
                
            }
            button {
                background-color: rgb(54, 51, 211);
                border: none;
                border-radius: 500px;
                padding-left: 6px;
                padding-right: 6px;
                color: aliceblue;
                width: 70px;
                height: 40px;
                vertical-align: middle;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <img class= 'thumbnail' src="thumbnails/thumbnail-1.webp">
        <input class="enter" type='text' placeholder="Whats happening?">
        <button>
            Tweet
        </button>
    </body>
</html>
