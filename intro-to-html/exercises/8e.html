<!DOCTYPE html>
<html>
    <head>
        <title>
            Exercise 8e
        </title>
        <style>
            p {
                font-family: Arial;
            }
            .title {
                font-size: 30px;
                margin-bottom: 17px;
            }
            .location, .destination {
                background-color: rgb(247, 244, 244);
                font-size: 13px;
                padding-top: 12px;
                padding-bottom: 12px;
                padding-right: 120px;

                line-height: 6px;
                border: none;
            }

            .l {
                margin-bottom: 7px;
                margin-top: 15px;
            }

            .d {
                margin-bottom: 25px;
                margin-top: 0px;
            }

            .Request-button {
                color: white;
                background-color: black;
                border: none;
                padding-top: 14px;
                padding-bottom: 14px;
                padding-left: 16px;
                padding-right: 16px;
            }

            .Schedule-button {
                background-color: rgb(247, 244, 244);
                border: none;
                padding-top: 14px;
                padding-bottom: 14px;
                padding-left: 16px;
                padding-right: 16px;
                margin-left: 15px;
            }
        </style>
       

    <body>
        <p class="title">
            Request a ride now
        </p>

        <p class="l">
            <input class="location" type='text'  placeholder="Enter pickup location">
        </p>

        <p class="d">
            <input class="destination" type='text'  placeholder="Enter destination">
        </p>

        <button class="Request-button">
            Request now
        </button>

        <button class="Schedule-button">
            Schedule for later
        </button>    
    </body>

</html>
